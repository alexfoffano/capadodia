<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capa do Dia — adivinhe o álbum</title>
<meta name="description" content="Um álbum novo por dia. Descubra a capa escondida em 6 tentativas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="bar-side">
    <button class="icon-btn" id="btn-help" aria-label="Como jogar" title="Como jogar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.2a2.8 2.8 0 1 1 3.5 2.7c-.6.2-.9.7-.9 1.4v.4"/><circle cx="12" cy="17" r=".9" class="dot"/></svg>
    </button>
    <button class="icon-btn" id="btn-archive" aria-label="Jogos anteriores" title="Jogos anteriores">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.2" width="17" height="15.3" rx="2.6"/><path d="M3.5 9.8h17M8 3.3v3.6M16 3.3v3.6"/></svg>
    </button>
  </div>

  <h1 class="logo" id="logo">Capa<span>do</span>Dia</h1>

  <div class="bar-side right">
    <button class="icon-btn" id="btn-lang" aria-label="Idioma" title="Idioma" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.2 9.5h17.6M3.2 14.5h17.6M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
    </button>
    <button class="icon-btn" id="btn-mode" aria-label="Versão" title="Versão" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.6 10.1 L21.2 10.5 L21.2 13.5 L18.6 13.9 L18.0 15.3 L19.5 17.5 L17.5 19.5 L15.3 18.0 L13.9 18.6 L13.5 21.2 L10.5 21.2 L10.1 18.6 L8.7 18.0 L6.5 19.5 L4.5 17.5 L6.0 15.3 L5.4 13.9 L2.8 13.5 L2.8 10.5 L5.4 10.1 L6.0 8.7 L4.5 6.5 L6.5 4.5 L8.7 6.0 L10.1 5.4 L10.5 2.8 L13.5 2.8 L13.9 5.4 L15.3 6.0 L17.5 4.5 L19.5 6.5 L18.0 8.7 Z"/><circle cx="12" cy="12" r="3.1"/></svg>
    </button>
    <button class="icon-btn" id="btn-stats" aria-label="Estatísticas" title="Estatísticas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-6M12 20V5M19 20v-9"/></svg>
    </button>
  </div>
</header>

<div class="menu" id="menu" role="menu" hidden></div>

<main class="wrap">

  <p class="archive-bar" id="archive-bar" hidden></p>

  <section class="cover-stage">
    <div class="cover-frame">
      <canvas id="cover" width="640" height="640" aria-label="Capa do álbum distorcida"></canvas>
      <div class="cover-glare" aria-hidden="true"></div>
    </div>
    <p class="stage-label" id="stage-label">Tentativa 1 de 6</p>
    <div class="pips" id="pips" aria-hidden="true"></div>
  </section>

  <form class="guess-bar" id="guess-form" autocomplete="off">
    <div class="combo">
      <input type="text" id="guess-input" placeholder="Digite um álbum ou artista…"
             aria-label="Seu palpite" autocomplete="off" autocorrect="off" spellcheck="false">
      <ul class="suggestions" id="suggestions" role="listbox"></ul>
    </div>
    <button type="submit" class="btn primary" id="btn-guess">Chutar</button>
    <button type="button" class="btn ghost" id="btn-skip" title="Pular revela mais da capa e gasta uma tentativa">Pular</button>
  </form>

  <p class="counter" id="counter"></p>

  <section class="board" id="board" aria-live="polite"></section>

</main>

<footer class="rodape" id="rodape"></footer>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="Fechar">×</button>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="data/albums.js"></script>
<script src="data/calendar.js"></script>
<script src="data/extras.js" defer></script>
<script src="js/modes.js"></script>
<script src="js/i18n.js"></script>
<script src="js/taxonomy.js"></script>
<script src="js/game.js"></script>
</body>
</html>
